<div class="bg-white rounded-lg shadow-md hover:shadow-lg transition-shadow duration-300 overflow-hidden relative">

  <div class="aspect-square bg-gray-100 flex items-center justify-center">
    <img [src]="getImage(product)" [alt]="product.name" class="w-full h-full object-cover" />
  </div>

  <div class="p-4">
    <a class="text-xs text-blue-600 font-medium line-clamp-1 cursor-pointer">
      {{ product.category.name }}
    </a>

    <h3 class="font-semibold text-gray-900 mt-1 mb-2 line-clamp-1">
      {{ product.name }}
    </h3>

    <p class="text-gray-600 text-sm mb-3 line-clamp-2">
      {{ product.description }}
    </p>

    <div class="mb-4">
      <span class="text-xl font-bold text-gray-900">
        {{ product.price }}
      </span>
      <div class="text-xs text-gray-500 mt-1">
        Stock: {{ product.stock }}
      </div>
    </div>

    <div class="flex gap-2 items-center">
      <a [routerLink]="['/product-view', product._id]"
        class="flex-1 bg-blue-600 text-white py-2 px-4 rounded-md text-center text-sm">
        Ver más
      </a>

      <!-- Si el producto NO está en carrito, mostrar botón añadir -->
      <button
        *ngIf="!cartItem"
        [disabled]="product.stock === 0 || loading"
        (click)="addToCart()"
        class="px-4 py-2 rounded-md bg-green-600 hover:bg-green-700 text-white text-sm">
        🛒
      </button>

      <!-- Si el producto ESTÁ en carrito, mostrar controles de cantidad -->
      <div *ngIf="cartItem" class="flex items-center gap-2">
        <button
          (click)="decrease()"
          class="px-3 py-1 rounded-md bg-red-500 hover:bg-red-600 text-white text-sm">
          -
        </button>
        <span class="text-sm font-medium">{{ cartItem.quantity }}</span>
        <button
          (click)="increase()"
          class="px-3 py-1 rounded-md bg-green-500 hover:bg-green-600 text-white text-sm">
          +
        </button>
        <button
          (click)="remove()"
          class="px-3 py-1 rounded-md bg-gray-500 hover:bg-gray-600 text-white text-sm">
          🗑️
        </button>
      </div>
    </div>
  </div>
</div>
