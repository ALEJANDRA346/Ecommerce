<div class="max-w-3xl mx-auto p-6 bg-white shadow rounded-lg">
  <h1 class="text-2xl font-bold mb-4">Tu Carrito</h1>

  <ng-container *ngIf="(cart$ | async) as cart">

    <!-- Carrito vacío -->
    <div
      *ngIf="!cart || cart.products.length === 0"
      class="text-center py-10 text-gray-500"
    >
      No tienes productos en el carrito.
    </div>

    <!-- Carrito con productos -->
    <div *ngIf="cart && cart.products.length > 0" class="space-y-4">

      <div
        *ngFor="let item of cart.products"
        class="flex items-center justify-between border-b pb-4"
      >
        <!-- Imagen + nombre -->
        <div class="flex items-center gap-4">
          <img
            [src]="getImage(item.product)"
            class="w-16 h-16 object-cover rounded"
          />

          <div>
            <h2 class="font-semibold">{{ item.product.name }}</h2>
            <p class="text-sm text-gray-500">$ {{ item.product.price }}</p>
          </div>
        </div>

        <!-- Controles cantidad -->
        <div class="flex items-center gap-3">
          <button
            (click)="decrease(item.product._id, item.quantity)"
            class="bg-gray-200 px-3 py-1 rounded"
          >
            –
          </button>

          <span class="font-medium">{{ item.quantity }}</span>

          <button
            (click)="increase(item.product._id)"
            class="bg-gray-200 px-3 py-1 rounded"
          >
            +
          </button>
        </div>

        <!-- Subtotal -->
        <div class="font-semibold">
          $ {{ item.product.price * item.quantity }}
        </div>

        <!-- Eliminar -->
        <button
          (click)="remove(item.product._id)"
          class="text-red-500 hover:underline"
        >
          Eliminar
        </button>
      </div>

      <!-- Total -->
      <div class="text-right text-xl font-bold mt-6">
        Total: $ {{ total$ | async }}
      </div>

      <!-- Botones -->
      <div class="flex justify-between mt-6">
        <button
          (click)="clearCart()"
          class="bg-red-500 text-white py-2 px-5 rounded hover:bg-red-600"
        >
          Vaciar carrito
        </button>

        <button
          (click)="goCheckout()"
          class="bg-blue-600 text-white py-2 px-5 rounded hover:bg-blue-700"
        >
          Ir a checkout
        </button>
      </div>
    </div>
  </ng-container>
</div>
