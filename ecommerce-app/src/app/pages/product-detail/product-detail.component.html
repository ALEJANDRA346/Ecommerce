<div class="max-w-4xl mx-auto p-6 bg-white rounded shadow" *ngIf="product">

  <img
    [src]="getImage(product)"
    class="w-full max-h-[400px] object-cover rounded mb-6"
  />

  <h1 class="text-3xl font-bold mb-4">{{ product.name }}</h1>

  <p class="text-gray-600 mb-4">{{ product.description }}</p>

  <p class="text-xl font-bold mb-4">$ {{ product.price }}</p>

  <button
    class="bg-green-600 text-white px-6 py-3 rounded hover:bg-green-700"
    (click)="addToCart()"
  >
    Agregar al carrito 🛒
  </button>

</div>
