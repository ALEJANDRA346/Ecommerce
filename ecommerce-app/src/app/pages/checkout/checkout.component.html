<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow">
  <h1 class="text-2xl font-bold mb-4">Checkout</h1>
  <form [formGroup]="checkoutForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="block mb-1">Dirección</label>
      <input class="border rounded w-full p-2" formControlName="address" />
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block mb-1">Ciudad</label>
        <input class="border rounded w-full p-2" formControlName="city" />
      </div>
      <div>
        <label class="block mb-1">Código Postal</label>
        <input class="border rounded w-full p-2" formControlName="postalCode" />
      </div>
    </div>
    <div>
      <label class="block mb-1">País</label>
      <input class="border rounded w-full p-2" formControlName="country" />
    </div>
    <div>
      <label class="block mb-1">Método de pago</label>
      <select class="border rounded w-full p-2" formControlName="paymentMethod">
        <option value="card">Tarjeta</option>
        <option value="transfer">Transferencia</option>
      </select>
    </div>

    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
      Confirmar pedido
    </button>
  </form>
</div>
